<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pigugno</title>
  <style>
    :root {
      color-scheme: dark;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #1f1a17 0%, #3d2b1f 100%);
      color: #f8f1e7;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: url('./img/carte_piacentine/spade_fante.jpg');
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
      opacity: 0.16;
      pointer-events: none;
    }

    .panel {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2.5rem 3rem;
      border-radius: 1.5rem;
      background: rgba(18, 15, 12, 0.72);
      backdrop-filter: blur(6px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 1rem;
      font-size: clamp(3rem, 7vw, 5rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 700;
    }

    .subtitle {
      margin: 0 0 2rem;
      font-size: 1rem;
      color: #eadbc4;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 999px;
      padding: 0.95rem 1.6rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.2);
    }

    .primary {
      background: #d8a24a;
      color: #22160f;
    }

    .secondary {
      background: #f5ede2;
      color: #2c2119;
    }
  </style>
</head>

<body>
  <main class="panel">
    <h1>Pigugno</h1>
    <p class="subtitle">Scegli la modalità di gioco e preparati a sfidare il mazzo.</p>
    <div class="actions">
      <a class="button primary" href="./game/single.html">Partita contro il computer</a>
      <a class="button secondary" href="./game/network.html">Partita in rete con amici</a>
    </div>
  </main>
</body>

</html>
