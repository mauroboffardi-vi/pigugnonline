<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Partita singola - Pigugno</title>
    <link rel="stylesheet" href="../styles/card.css" />
    <link rel="stylesheet" href="../styles/game.css" />
    <link rel="stylesheet" href="../styles/animation.css" />
    <link rel="stylesheet" href="../styles/hand_score.css" />
    <link rel="stylesheet" href="../styles/game_score.css" />
    <link rel="stylesheet" href="../styles/gameover.css" />
    <link rel="preload" href="../fonts/pinkend/Pinkend-Regular.woff2" as="font" type="font/woff2" crossorigin />
</head>

<body>
    <div id="test-buttons"
        style="position:fixed;top:12px;right:12px;z-index:99999;display:flex;flex-direction:column;gap:8px;">
        <button type="button" data-test-preset="normal">TEST normale</button>
        <button type="button" data-test-preset="pigugno-you">TEST pigugno tu</button>
        <button type="button" data-test-preset="no-capture-you">TEST tu senza prese</button>
        <button type="button" data-test-preset="ten-tricks-left">TEST 10 prese sinistra</button>
        <button type="button" data-test-preset="two-no-capture">TEST due senza prese</button>
    </div>

    <main class="table-shell">
        <section class="table" aria-label="Tavolo di gioco">
            <div class="score-note-slot" id="busche-note" aria-label="Segnapunti busche"></div>
            <div class="player-area top" id="player-top" data-cell="1B"></div>
            <div class="player-area left" id="player-left" data-cell="2A"></div>
            <div class="table-center" id="table-center" data-cell="2B"></div>
            <div class="player-area right" id="player-right" data-cell="2C"></div>
            <div class="player-area bottom" id="player-you" data-cell="3A-3C"></div>
        </section>
    </main>

    <script type="module" src="./single.js"></script>
    <script type="module" src="./test/test_buttons.js"></script>
</body>

</html>
